# Garden watering — deployable config for automation.garden_watering_daily_unless_rain
#
# NOT part of the Blockheat automation set. Kept in docs/ (not automations/) because
# it is a separate system and uses modern plural triggers/conditions/actions keys.
# Rationale, plant species, measurements and tuning guidance: docs/garden-irrigation.md
#
# INTERIM CONFIG. Run durations are deliberately UNCHANGED from the original daily
# schedule; only the frequency drops (daily -> Mon/Thu). The drip hose is rated
# 1.5 bar and the house main reads 5.16 bar, so measured output is ~70 L/m/h —
# roughly an order of magnitude above design. At that flow rate a sane weekly volume
# is reached in ~3-4 min per zone, so durations cannot be tuned meaningfully until a
# pressure reducer is fitted. Cutting frequency is the one safe lever that does not
# require knowing the post-reducer flow rate.
#
# NEXT: fit the pressure reducer downstream of the main valve, re-measure with
# sensor.cubic_secure_laundry_total_volume, then set proper deep-soak durations.
#
# Constraints encoded below:
#   - Only ONE zone open at a time (shared supply pressure).
#   - SONOFF SWV valves hardware-close ~30 min after opening; each zone is its own
#     open/close session so the main is never open past the cap.
#   - Ilex crenata 'Caroline Upright' dies far more often from Phytophthora root rot
#     in constantly wet soil than from drought.

id: '1783625446726'
alias: Garden watering — Mon/Thu unless rain
description: >-
  Mon/Thu at 06:00, skipped if 3-day forecast rain >= 10 mm. Frequency reduced from
  daily 2026-07-28: measured use was ~670 L per run (~4700 L/week), which is several
  times what the Ilex crenata 'Caroline Upright' hedges need and risks Phytophthora
  root rot. Durations are unchanged pending a pressure reducer — the hose is rated
  1.5 bar, the main reads 5.16 bar, so run times cannot be tuned until flow is
  brought to spec. Each zone is its OWN session (open main -> water one zone -> close
  main) so no SONOFF valve is commanded open past its ~30-min hardware auto-close.
  Order: lawn 15 min, top hedge 10, middle hedge 10, bottom hedge 23. Terrace
  excluded — manual only. Rationale and measurements: docs/garden-irrigation.md
mode: single

triggers:
  - trigger: time
    at: "06:00:00"

conditions:
  - condition: time
    weekday: [mon, thu]
    note: >-
      Interim frequency cut (was daily). Halves-and-then-some the weekly volume
      without guessing at durations, which cannot be set sensibly until the drip
      line runs at its rated 1.5 bar.

actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.forecast_home
    response_variable: fc

  - variables:
      rain_3d: >-
        {{ (fc['weather.forecast_home']['forecast'][:3]
            | map(attribute='precipitation') | map('float', 0) | sum) | round(1) }}

  - if:
      - "{{ rain_3d < 10 }}"
    then:
      - action: switch.turn_off
        target:
          entity_id:
            - switch.sonoff_swv
            - switch.sonoff_valve_back
            - switch.sonoff_valve_terrace
            - switch.outside_sonoff_hedge_down_right
        continue_on_error: true
        note: >-
          Clean slate — only one zone may ever be open at a time (shared pressure).
      - action: select.select_option
        target:
          entity_id: select.aquaprecise_watering
        data:
          option: rest
        continue_on_error: true

      # --- Session 1/4: lawn (AquaPrecise contour_1), 15 min ---
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_swv_2
        note: Session 1 of 4 — lawn (AquaPrecise contour_1).
      - delay: {seconds: 10}
      - action: number.set_value
        target:
          entity_id: number.aquaprecise_manual_watering_time
        data:
          value: 900
      - action: select.select_option
        target:
          entity_id: select.aquaprecise_watering
        data:
          option: contour_1
      - delay: {minutes: 15}
      - action: select.select_option
        target:
          entity_id: select.aquaprecise_watering
        data:
          option: rest
      - delay: {seconds: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_swv_2
      - delay: {seconds: 20}

      # --- Session 2/4: top hedge (10 m), 10 min ---
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_swv_2
        note: >-
          Session 2 of 4 — top hedge (10 m). entity_id says 'terrace' but this valve
          is the TOP HEDGE.
      - delay: {seconds: 10}
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_valve_terrace
      - delay: {minutes: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_valve_terrace
      - delay: {seconds: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_swv_2
      - delay: {seconds: 20}

      # --- Session 3/4: middle hedge (10 m), 10 min ---
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_swv_2
        note: Session 3 of 4 — middle hedge (10 m).
      - delay: {seconds: 10}
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_valve_back
      - delay: {minutes: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_valve_back
      - delay: {seconds: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_swv_2
      - delay: {seconds: 20}

      # --- Session 4/4: bottom hedge (23 m, centre-fed), 23 min ---
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_swv_2
        note: >-
          Session 4 of 4 — bottom hedge (23 m, centre-fed). Longest run and lowest
          end-of-line pressure, so it gets the longest time.
      - delay: {seconds: 10}
      - action: switch.turn_on
        target:
          entity_id: switch.sonoff_swv
      - delay: {minutes: 23}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_swv
      - delay: {seconds: 10}
      - action: switch.turn_off
        target:
          entity_id: switch.sonoff_swv_2

      - action: logbook.log
        data:
          name: Garden watering
          message: >-
            Watered lawn 15 + top 10 + middle 10 + bottom 23 min (per-zone sessions,
            Mon/Thu). 3-day forecast rain {{ rain_3d }} mm.
    else:
      - action: logbook.log
        data:
          name: Garden watering
          message: >-
            Skipped watering — 3-day forecast rain {{ rain_3d }} mm >= 10 mm.
