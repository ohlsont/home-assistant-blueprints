# Blockheat — Final Writer
# Selects the saving or comfort target and enforces a washroom minimum before
# writing the reported temperature to Ohmigo.
#
# Parameters:
#   control_write_delta_c = 0.2 °C  (only write if |target - current| >= 0.2)
#   control_min_c         = 10.0 °C
#   control_max_c         = 26.0 °C
#   rearm_settle_s        = 30 s    (Ohmigo must hold a value this long to re-arm)
#   rearm_sweep_min       = 10 min  (periodic re-assert)
#
# Re-arm triggers: the inputs alone are not enough. The Ohmigo reverts to its
# own value on its own -- after an HA restart, or spontaneously -- and while the
# targets sit still nothing here fires, so a stale setpoint can persist for
# hours. Watching the Ohmigo itself plus a periodic sweep closes that hole.
# The `for:` delay keeps the automation from chasing the echo of its own write
# and damps ping-pong if the device fights back.

alias: "Blockheat — Final Writer"
description: >
  Selects saving or comfort target, with a washroom minimum in either mode.
  Clamps to [10, 26] °C and writes to
  number.ohmigo_temperature_2 only when the change exceeds the 0.2 °C deadband.
  Re-asserts the target when the Ohmigo drifts on its own or after a restart.
mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id:
      - input_boolean.energy_saving_active
      - input_number.blockheat_target_saving
      - input_number.blockheat_target_comfort
      - input_number.blockheat_bor
      - input_boolean.blockheat_comfort_overheat_guard
      - sensor.sonoff_snzb_02d_washing_temperature
  - platform: state
    entity_id: number.ohmigo_temperature_2
    for: "00:00:30"
  - platform: time_pattern
    minutes: "/10"
condition:
  # Never compute against a missing reading: `current` would fall back to 0.0
  # and force a spurious write.
  - condition: not
    conditions:
      - condition: state
        entity_id: number.ohmigo_temperature_2
        state:
          - unknown
          - unavailable
action:
  - variables:
      bor: >
        {{ states('input_number.blockheat_bor') | float(22.0) }}
      washroom: >
        {{ states('sensor.sonoff_snzb_02d_washing_temperature') | float(none) }}
      washroom_demand_active: >
        {{ is_state('input_boolean.blockheat_washroom_heat_demand', 'on') }}
      washroom_heat_demand: >
        {{ washroom is not none and washroom < bor - (0.5 if washroom_demand_active else 1.0) }}
      saving: >
        {{ states('input_number.blockheat_target_saving') | float(21) }}
      comfort: >
        {{ states('input_number.blockheat_target_comfort') | float(22) }}
      normal_target: >
        {{ saving if is_state('input_boolean.energy_saving_active', 'on') else comfort }}
      raw: >
        {{ [normal_target, bor - 2.0] | min
           if washroom_heat_demand and is_state('input_boolean.blockheat_comfort_overheat_guard', 'off')
           else normal_target }}
      target: >
        {{ [[raw, 10.0] | max, 26.0] | min }}
      current: >
        {{ states('number.ohmigo_temperature_2') | float(0) }}
  - if:
      - condition: template
        value_template: "{{ washroom_heat_demand != washroom_demand_active }}"
    then:
      - action: "{{ 'input_boolean.turn_on' if washroom_heat_demand else 'input_boolean.turn_off' }}"
        target:
          entity_id: input_boolean.blockheat_washroom_heat_demand
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ ((target - current) | abs) >= 0.2 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.ohmigo_temperature_2
            data:
              value: "{{ target }}"
