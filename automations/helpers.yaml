# Blockheat replacement helpers
# Apply via MCP: ha_config_set_helper × 11
#
# These replace the unavailable blockheat integration entities:
#   binary_sensor.blockheat_energy_saving_active  → input_boolean.energy_saving_active
#   sensor.blockheat_target_saving                → input_number.blockheat_target_saving
#   sensor.blockheat_target_comfort               → input_number.blockheat_target_comfort
#
# Additional helpers:
#   input_number.blockheat_bor  — heat pump BOR-värde (indoor setpoint)
#   input_boolean.blockheat_comfort_solar_backoff — comfort warm+sunny backoff state
#     (hysteresis flag written by comfort_target.yaml; see that file's solar_backoff logic)
#   input_boolean.blockheat_comfort_overheat_guard — comfort overheat guard state
#     (hysteresis flag written by comfort_target.yaml; see that file's overheat_guard logic)
#   input_boolean.blockheat_sensor_alert_* — notify-once flags written by
#     sensor_health.yaml (on = an alert went out; off = sensor healthy again)

- platform: input_boolean
  name: energy_saving_active
  icon: mdi:lightning-bolt

- platform: input_boolean
  name: blockheat_comfort_solar_backoff
  icon: mdi:weather-sunny

- platform: input_boolean
  name: blockheat_comfort_overheat_guard
  icon: mdi:thermometer-alert

- platform: input_number
  name: blockheat_bor
  min: 18
  max: 26
  step: 0.5
  unit_of_measurement: "°C"
  icon: mdi:thermostat
  mode: box

- platform: input_number
  name: blockheat_target_saving
  min: 10
  max: 26
  step: 0.1
  unit_of_measurement: "°C"
  icon: mdi:thermometer-low
  mode: box

- platform: input_number
  name: blockheat_target_comfort
  min: 10
  max: 26
  step: 0.1
  unit_of_measurement: "°C"
  icon: mdi:thermometer-high
  mode: box

- platform: input_boolean
  name: blockheat_sensor_alert_room1
  icon: mdi:thermometer-alert

- platform: input_boolean
  name: blockheat_sensor_alert_room2
  icon: mdi:thermometer-alert

- platform: input_boolean
  name: blockheat_sensor_alert_room2_fallback
  icon: mdi:thermometer-alert

- platform: input_boolean
  name: blockheat_sensor_alert_storage
  icon: mdi:thermometer-alert

- platform: input_boolean
  name: blockheat_sensor_alert_blind
  icon: mdi:thermometer-alert
