# ─── Solar & Battery Savings Sensors ─────────────────────────────────
#
# Savings model (see docs / README):
#   The battery is operated by Checkwatt for FCR-D grid services, so its
#   cycling is NOT home arbitrage — its value is captured by Checkwatt income
#   and the Tibber grid cost/reward. Battery charge/discharge are therefore
#   deliberately excluded from the savings totals.
#
#   Genuine, non-overlapping benefit streams:
#     1. Solar self-consumed (full retail) = solar serving house load, valued
#        at electricity_price + grid_fee (the avoided all-in import price).
#     2. Grid export reward (Tibber pays for exported energy).
#     3. Checkwatt income (battery FCR revenue, already net).
#
#   Requires helper: input_number.solar_grid_fee_sek_kwh (grid-side avoided
#   cost — Vattenfall transfer fee + energy tax, incl VAT; default 0.93).

template:
  - sensor:
      # Self-consumed solar power (W) — solar that serves house load.
      # Robust to Checkwatt battery cycling: the battery and grid terms are
      # netted into home_load, then solar is capped at the load it can serve.
      - name: "Solar Self-Consumption Power"
        unique_id: solar_self_consumption_power
        unit_of_measurement: "W"
        device_class: power
        attributes:
          description: >-
            Solar serving house load (W).
            home_load = PV_AC + discharge + grid_import - charge - grid_export.
            self_consumed = max(min(PV_AC, home_load), 0).
            PV_AC = (Vpv1 x Ipv1 + Vpv2 x Ipv2) x 0.95.
        state: >-
          {% set inv = 'sensor.inverter_5015kett248l0096_power' %}
          {% set vpv1 = state_attr(inv, 'vpv1') | float(0) %}
          {% set ipv1 = state_attr(inv, 'ipv1') | float(0) %}
          {% set vpv2 = state_attr(inv, 'vpv2') | float(0) %}
          {% set ipv2 = state_attr(inv, 'ipv2') | float(0) %}
          {% set pv_ac = (vpv1 * ipv1 + vpv2 * ipv2) * 0.95 %}
          {% set batt = state_attr(inv, 'total_pbattery') | float(0) %}
          {% set grid_imp = states('sensor.power_tarngatan_2') | float(0) %}
          {% set grid_exp = states('sensor.power_production_tarngatan_2') | float(0) %}
          {% set discharge = [batt, 0] | max %}
          {% set charge = [0 - batt, 0] | max %}
          {% set home_load = pv_ac + discharge + grid_imp - charge - grid_exp %}
          {{ ([[pv_ac, home_load] | min, 0] | max) | round(0) }}

      # Solar self-consumption savings rate (SEK/h) — full retail value.
      - name: "Solar Self-Consumption Savings Rate"
        unique_id: solar_self_consumption_savings_rate
        unit_of_measurement: "SEK/h"
        device_class: monetary
        attributes:
          description: >-
            Self-consumed solar valued at the avoided all-in import price.
            Formula: self_consumed_W / 1000 x (electricity_price + grid_fee).
            grid_fee = input_number.solar_grid_fee_sek_kwh.
        state: >-
          {% set power = states('sensor.solar_self_consumption_power') | float(0) %}
          {% set price = states('sensor.electricity_price_tarngatan_2') | float(0) %}
          {% set grid_fee = states('input_number.solar_grid_fee_sek_kwh') | float(0.93) %}
          {{ (power / 1000 * (price + grid_fee)) | round(2) }}
        availability: >-
          {{ states('sensor.electricity_price_tarngatan_2') | is_number }}

      # PV power (AC estimate from string data)
      - name: "Solar PV Power"
        unique_id: solar_pv_power
        unit_of_measurement: "W"
        device_class: power
        attributes:
          description: >-
            AC power estimate from DC string data.
            Formula: (Vpv1 x Ipv1 + Vpv2 x Ipv2) x 0.95 (DC to AC)
        state: >-
          {% set inv = 'sensor.inverter_5015kett248l0096_power' %}
          {% set vpv1 = state_attr(inv, 'vpv1') | float(0) %}
          {% set ipv1 = state_attr(inv, 'ipv1') | float(0) %}
          {% set vpv2 = state_attr(inv, 'vpv2') | float(0) %}
          {% set ipv2 = state_attr(inv, 'ipv2') | float(0) %}
          {{ ((vpv1 * ipv1 + vpv2 * ipv2) * 0.95) | round(0) }}

      # Battery power (positive = discharge, negative = charge)
      - name: "Battery Power"
        unique_id: battery_power_template
        unit_of_measurement: "W"
        device_class: power
        attributes:
          description: >-
            Inverter total_pbattery attribute.
            Positive = discharge, negative = charge.
        state: >-
          {{ state_attr('sensor.inverter_5015kett248l0096_power', 'total_pbattery') | float(0) | round(0) }}

      # Battery SoC (Checkwatt with inverter fallback)
      - name: "Battery SoC"
        unique_id: battery_soc_template
        unit_of_measurement: "%"
        device_class: battery
        attributes:
          description: >-
            Checkwatt SoC with inverter fallback.
            Uses sensor.checkwatt_battery_soc if available,
            otherwise inverter soc attribute.
        state: >-
          {% set cw = states('sensor.checkwatt_battery_soc') %}
          {% if cw not in ['unavailable', 'unknown', 'none'] and cw | is_number %}
            {{ cw }}
          {% else %}
            {{ state_attr('sensor.inverter_5015kett248l0096_power', 'soc') | float(0) }}
          {% endif %}

      # ── Net savings totals (non-overlapping streams) ──

      # Today's total savings (SEK)
      - name: "Savings Total Today"
        unique_id: savings_total_today
        unit_of_measurement: "SEK"
        device_class: monetary
        attributes:
          description: >-
            Net savings today: solar self-consumed (full retail)
            + grid export reward + Checkwatt income.
        state: >-
          {% set solar = states('sensor.solar_self_consumption_value_today') | float(0) %}
          {% set reward = states('sensor.tibber_pulse_tarngatan_2_accumulated_reward') | float(0) %}
          {% set checkwatt = states('sensor.checkwatt_checkwatt_daily_net_income') | float(0) %}
          {{ (solar + reward + checkwatt) | round(2) }}

      # This month's total savings (SEK)
      - name: "Savings Total Monthly"
        unique_id: savings_total_monthly
        unit_of_measurement: "SEK"
        device_class: monetary
        attributes:
          description: >-
            Net savings this month: solar self-consumed (full retail)
            + grid export reward + Checkwatt income.
        state: >-
          {% set solar = states('sensor.solar_self_consumption_value_monthly') | float(0) %}
          {% set reward = states('sensor.grid_export_reward_monthly') | float(0) %}
          {% set checkwatt = states('sensor.checkwatt_checkwatt_monthly_net_income') | float(0) %}
          {{ (solar + reward + checkwatt) | round(2) }}

      # Annual total savings (SEK)
      - name: "Total Annual Savings"
        unique_id: total_annual_savings
        unit_of_measurement: "SEK"
        device_class: monetary
        attributes:
          description: >-
            Net savings this year: solar self-consumed (full retail)
            + grid export reward + Checkwatt income.
            Note: yearly meters count since their last reset, not necessarily
            since 1 Jan.
        state: >-
          {% set solar = states('sensor.solar_self_consumption_value_yearly') | float(0) %}
          {% set reward = states('sensor.grid_export_reward_yearly') | float(0) %}
          {% set checkwatt = states('sensor.checkwatt_checkwatt_annual_net_income') | float(0) %}
          {{ (solar + reward + checkwatt) | round(0) }}

# ─── Riemann Sum Integration ────────────────────────────────────────

sensor:
  # Self-consumption value (SEK/h → SEK)
  - platform: integration
    source: sensor.solar_self_consumption_savings_rate
    name: "Solar Self-Consumption Value"
    unique_id: solar_self_consumption_value
    unit_prefix: ~
    unit_time: h
    round: 2
    method: left

  # Self-consumption energy (W → kWh)
  - platform: integration
    source: sensor.solar_self_consumption_power
    name: "Solar Self-Consumption Energy"
    unique_id: solar_self_consumption_energy
    unit_prefix: k
    unit_time: h
    round: 2
    method: left

# ─── Utility Meters ─────────────────────────────────────────────────

utility_meter:
  # Self-consumption value (full retail)
  solar_self_consumption_value_today:
    source: sensor.solar_self_consumption_value
    name: "Solar Self-Consumption Value Today"
    unique_id: solar_self_consumption_value_today
    cycle: daily

  solar_self_consumption_value_monthly:
    source: sensor.solar_self_consumption_value
    name: "Solar Self-Consumption Value Monthly"
    unique_id: solar_self_consumption_value_monthly
    cycle: monthly

  solar_self_consumption_value_yearly:
    source: sensor.solar_self_consumption_value
    name: "Solar Self-Consumption Value Yearly"
    unique_id: solar_self_consumption_value_yearly
    cycle: yearly

  # Self-consumption energy (kWh)
  solar_self_consumption_energy_today:
    source: sensor.solar_self_consumption_energy
    name: "Solar Self-Consumption Energy Today"
    unique_id: solar_self_consumption_energy_today
    cycle: daily

  # Grid export reward
  grid_export_reward_monthly:
    source: sensor.tibber_pulse_tarngatan_2_accumulated_reward
    name: "Grid Export Reward Monthly"
    unique_id: grid_export_reward_monthly
    cycle: monthly

  grid_export_reward_yearly:
    source: sensor.tibber_pulse_tarngatan_2_accumulated_reward
    name: "Grid Export Reward Yearly"
    unique_id: grid_export_reward_yearly
    cycle: yearly
