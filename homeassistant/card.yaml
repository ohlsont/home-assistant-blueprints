type: vertical-stack
cards:
  # ── Section 1: Today's Savings ──
  - type: markdown
    content: "## Today's Savings"

  - type: entities
    entities:
      - entity: sensor.solar_self_consumption_value_today
        name: Solar self-consumed (full retail)
        icon: mdi:solar-power-variant
      - entity: sensor.tibber_pulse_tarngatan_2_accumulated_reward
        name: Grid export reward
        icon: mdi:transmission-tower-export
      - entity: sensor.checkwatt_checkwatt_daily_net_income
        name: Checkwatt income
        icon: mdi:cash-check
      - type: divider
      - entity: sensor.savings_total_today
        name: Total saved today
        icon: mdi:piggy-bank

  # ── Section 2: Today — energy & grid (context, not savings) ──
  - type: markdown
    content: "## Today — energy & grid"

  - type: entities
    entities:
      - entity: sensor.solar_self_consumption_energy_today
        name: Self-consumed solar
        icon: mdi:solar-power
      - entity: sensor.accumulated_consumption_tarngatan_2
        name: Grid import
        icon: mdi:transmission-tower-import
      - entity: sensor.accumulated_production_tarngatan_2
        name: Grid export
        icon: mdi:transmission-tower-export
      - entity: sensor.accumulated_cost_tarngatan_2
        name: Grid cost
        icon: mdi:cash-minus

  # ── Section 3: Real-time ──
  - type: markdown
    content: "## Real-time"

  - type: glance
    show_name: true
    show_state: true
    entities:
      - entity: sensor.solar_pv_power
        name: Solar
        icon: mdi:solar-power-variant
      - entity: sensor.battery_power
        name: Battery
        icon: mdi:battery-charging
      - entity: sensor.battery_soc
        name: SoC
        icon: mdi:battery
      - entity: sensor.electricity_price_tarngatan_2
        name: Price
        icon: mdi:currency-usd

  - type: entities
    entities:
      - entity: sensor.solar_self_consumption_power
        name: Solar self-consumption
        icon: mdi:solar-power
      - entity: sensor.solar_self_consumption_savings_rate
        name: Solar savings rate
        icon: mdi:solar-power-variant

  # ── Section 4: Monthly & Annual ──
  - type: markdown
    content: "## Monthly & Annual"

  - type: entities
    entities:
      - entity: sensor.solar_self_consumption_value_monthly
        name: Solar self-consumed (month)
        icon: mdi:solar-power-variant
      - entity: sensor.grid_export_reward_monthly
        name: Grid export reward (month)
        icon: mdi:transmission-tower-export
      - entity: sensor.checkwatt_checkwatt_monthly_net_income
        name: Checkwatt income (month)
        icon: mdi:cash-check
      - type: divider
      - entity: sensor.savings_total_monthly
        name: Total saved (month)
        icon: mdi:piggy-bank
      - type: divider
      - entity: sensor.solar_self_consumption_value_yearly
        name: Solar self-consumed (year)
        icon: mdi:solar-power-variant
      - entity: sensor.grid_export_reward_yearly
        name: Grid export reward (year)
        icon: mdi:transmission-tower-export
      - entity: sensor.checkwatt_checkwatt_annual_net_income
        name: Checkwatt income (year)
        icon: mdi:cash-check
      - type: divider
      - entity: sensor.total_annual_savings
        name: Total saved (year)
        icon: mdi:piggy-bank

  - type: markdown
    content: >-
      _Yearly figures count since the meters were last reset, not necessarily
      since 1 January._
